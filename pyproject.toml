[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-researcher"
version = "0.1.0"
description = "Local product-analytics research helper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "openai>=1.54.0",
  "anthropic>=0.39.0",
  "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
