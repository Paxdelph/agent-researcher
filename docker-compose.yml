services:
  app:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      AGENT_RESEARCHER_CONFIG: /app/config.yaml
      # Per research folder — switching RESEARCH_PATH remounts a clean/previous run state
      STATE_DIR: /workspace/.agent-researcher
      WORKSPACE_PATH: /workspace
      CONTEXT_PATH: /company/context.md
      RESEARCH_HOST_PATH: ${RESEARCH_PATH:-./researches/example}
    volumes:
      - ${RESEARCH_PATH:-./researches/example}:/workspace
      - ${CONTEXT_FILE:-./researches/context.md}:/company/context.md
      - ./config.yaml:/app/config.yaml:ro
      - ./app:/app/app:ro
      - ./quarto:/app/quarto:ro
